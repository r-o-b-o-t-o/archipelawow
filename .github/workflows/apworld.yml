name: APWorld

on:
  push:
    branches:
      - master
      - ci
  pull_request:
    branches:
      - master
  workflow_dispatch:
  # The release builds through here, so what it ships is what this workflow checks
  workflow_call:
    outputs:
      version:
        description: The world_version in archipelago.json
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Archipelago that packs the apworld, which is a different question from the one this world
  # runs on, the minimum archipelago.json names: the builder, and the .apignore it reads, arrived
  # in 0.6.7.
  AP_VERSION: "0.6.7"

jobs:
  build:
    name: Build and load
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}

    steps:
      - name: Check out Archipelago ${{ env.AP_VERSION }}
        uses: actions/checkout@v7
        with:
          repository: ArchipelagoMW/Archipelago
          ref: ${{ env.AP_VERSION }}
          path: archipelago

      # The builder packs a world from worlds/, names the archive after the folder it came from, and
      # that name is the module Archipelago imports, so the checkout path decides all three.
      - name: Check out this world into the Archipelago tree
        uses: actions/checkout@v7
        with:
          path: archipelago/worlds/worldofwarcraft

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install what building and loading a world takes
        # Not requirements.txt: that pulls in Kivy and a git checkout of KivyMD for the launcher UI,
        # which a component run from the command line never opens. pathspec is what reads .apignore.
        run: >
          pip install bsdiff4 certifi colorama jellyfish orjson pathspec platformdirs PyYAML schema
          typing_extensions websockets

      # The builder loads every world in the tree to find this one, and each of the others wants
      # packages this job has no reason to install, so their import failures would bury both steps
      # below. Out they go, bar the generic world a seed always needs and the support packages named
      # with a leading underscore.
      - name: Take the other worlds out of the tree
        working-directory: archipelago
        run: find worlds -mindepth 1 -maxdepth 1 -type d ! -name generic ! -name '_*' ! -name worldofwarcraft -exec rm -rf {} +

      - name: Build the apworld
        id: build
        working-directory: archipelago
        env:
          # Without this the launcher stops on an interactive pip prompt
          SKIP_REQUIREMENTS_UPDATE: "1"
        run: |
          python Launcher.py "Build APWorlds" -- "World of Warcraft"
          version=$(python -c "import json; print(json.load(open('worlds/worldofwarcraft/archipelago.json'))['world_version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Load it the way an installation would
        # Installed where a player installs one, and the checkout it was packed from taken away with
        # the rest, so the archive is the only thing left that can answer for the game.
        working-directory: archipelago
        env:
          # Without this a missing package stops the step on an interactive prompt to install it
          SKIP_REQUIREMENTS_UPDATE: "1"
        run: |
          mkdir -p custom_worlds
          mv build/apworlds/worldofwarcraft.apworld custom_worlds/
          rm -rf worlds/worldofwarcraft
          python - <<'PY'
          import worlds
          from worlds.AutoWorld import AutoWorldRegister

          game = "World of Warcraft"
          assert game in AutoWorldRegister.world_types, f"{game} did not register from the apworld"

          world = AutoWorldRegister.world_types[game]
          print(f"loaded {game} {world.world_version}, {len(world.item_name_to_id)} items, "
                f"{len(world.location_name_to_id)} locations")
          print("worlds registered:", sorted(AutoWorldRegister.world_types))
          PY

      - name: Write the default player options
        # The example Player.yaml a release ships, read from the apworld just loaded and laid out the way
        # the options page on archipelago.gg exports one left at its defaults.
        working-directory: archipelago
        env:
          SKIP_REQUIREMENTS_UPDATE: "1"
        run: |
          python - <<'PY'
          import yaml

          import Options
          import worlds
          from worlds.AutoWorld import AutoWorldRegister

          game = "World of Warcraft"
          world = AutoWorldRegister.world_types[game]


          def default_value(option):
              if option.default == "random":
                  return "random"
              if issubclass(option, Options.Toggle):
                  return "true" if option.default else "false"
              if issubclass(option, Options.Choice) and not isinstance(option.default, str):
                  return option.name_lookup[option.default]
              if issubclass(option, (Options.Choice, Options.Range, Options.FreeText)):
                  return str(option.default)
              if issubclass(option, Options.OptionCounter):
                  return {key: value for key, value in option.default.items() if value}
              if issubclass(option, (Options.OptionList, Options.OptionSet)):
                  return sorted(option.default)
              return None


          options = {}
          counters = {}
          for group in Options.get_option_groups(world, Options.Visibility.simple_ui).values():
              for name, option in group.items():
                  value = default_value(option)
                  if value is not None:
                      # The page posts a counter as one field per key and puts it together after every other option
                      (counters if issubclass(option, Options.OptionCounter) else options)[name] = value
          options.update(counters)

          player = {"name": "Player", "game": game, "description": f"Generated by https://archipelago.gg/ for {game}", game: options}
          with open("Player.yaml", "w") as file:
              yaml.dump(player, file, sort_keys=False)
          PY
          cat Player.yaml

      - name: Upload the apworld and Player.yaml
        uses: actions/upload-artifact@v7
        with:
          name: worldofwarcraft-${{ steps.build.outputs.version }}
          path: |
            archipelago/custom_worlds/worldofwarcraft.apworld
            archipelago/Player.yaml
          if-no-files-found: error
